[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auraseed"
version = "1.1.0"
description = "Zero-privilege Python runtime discovery, capability probing, and sovereign virtual environment (mvenv) engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
auraseed = "auraseed.__main__:main"

[tool.setuptools.packages.find]
include = ["auraseed*"]

[tool.setuptools.package-data]
auraseed = ["openapi.json", "openapi.yaml", "assets/*.ico", "assets/*.png"]
