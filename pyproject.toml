[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auraseed"
version = "1.1.1"
description = "Zero-privilege Python runtime discovery, capability probing, and sovereign virtual environment (mvenv) engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
auraseed = "auraseed.__main__:main"

[tool.setuptools.packages.find]
include = ["auraseed*"]

[tool.setuptools.package-data]
auraseed = ["openapi.json", "openapi.yaml", "assets/*.ico", "assets/*.png"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
